<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>איפה המורה? · כיתה פנויה</title>
<meta name="theme-color" content="#1546c0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Karantina:wght@700&display=swap" rel="stylesheet">
<style>
  /* same tokens as index.html (see DESIGN.md) */
  :root { --bg:#e9ebee; --tile:#fff; --edge:#b7bec8; --text:#14181f; --muted:#555e6c; --line:#cfd4db;
          --blue:#1546c0; --blue-edge:#0c2c80; --yellow:#f4c20d; --yellow-edge:#a98600; --ink:#14181f;
          --lamp:#17b26a; --lamp-hi:#b6ffd8; --lamp-lo:#0c7a47; --hi:rgba(255,255,255,.7);
          --display:Karantina,"Arial Narrow",system-ui,sans-serif; --press:90ms; --out:cubic-bezier(.16,1,.3,1); }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1218; --tile:#1f2530; --edge:#05070a; --text:#eef0f3; --muted:#a3abb8; --line:#2c3440;
          --hi:rgba(255,255,255,.07); } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { accent-color:var(--blue); caret-color:var(--blue); }
  ::selection { background:var(--yellow); color:var(--ink); }
  :focus-visible { outline:3px solid var(--yellow); outline-offset:2px; }
  body { margin:0; font-family:Heebo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--text); line-height:1.35; }
  main { max-width:560px; margin:0 auto; padding:0 16px max(32px,env(safe-area-inset-bottom)); }

  header { background:var(--blue); color:#fff; margin:0 -16px 20px; padding:max(18px,env(safe-area-inset-top)) 18px 24px; position:relative;
           display:grid; grid-template-columns:1fr auto; gap:10px 12px; align-items:end; }
  header::after { content:""; position:absolute; inset:auto 0 0; height:8px;
                  background:repeating-linear-gradient(-45deg,var(--yellow) 0 12px,var(--ink) 12px 24px); }
  header .back { grid-column:1 / -1; justify-self:start; }
  header h1 { font:700 3.4rem/.85 var(--display); margin:0; letter-spacing:.01em; }
  header .now { background:var(--ink); color:var(--yellow); border-radius:8px; padding:8px 12px 6px; text-align:center;
                font:700 2rem/.9 var(--display); box-shadow:inset 0 1px 0 rgba(255,255,255,.15), 0 3px 6px -2px rgba(0,0,0,.5); }
  header .now small { display:block; font:500 .7rem/1.4 Heebo,system-ui,sans-serif; color:#fff; }
  header .now:empty { display:none; }
  .muted { color:var(--muted); font-size:.8rem; }
  #updated { margin-top:26px; }

  /* keys: moulded, with a lower edge that the press travels onto (same as index.html) */
  button, .hk { font-family:inherit; font-size:16px; cursor:pointer; user-select:none; border:0; color:inherit; text-decoration:none;
           transition:transform var(--press) var(--out), box-shadow var(--press) var(--out), background-color 120ms; }
  .chip, .hk, .pick, .card button { --e:var(--edge); border-radius:10px; font-weight:700;
           box-shadow:inset 0 1px 0 var(--hi), 0 4px 0 var(--e), 0 8px 10px -5px rgba(0,0,0,.35); }
  .chip:active, .hk:active, .pick:active, .card button:active, .chip[aria-pressed=true] {
           transform:translateY(3px); box-shadow:inset 0 1px 0 var(--hi), 0 1px 0 var(--e), 0 2px 3px -1px rgba(0,0,0,.3); }
  .hk { display:inline-block; padding:8px 14px; background:#0f378f; color:#fff; --e:#082260; --hi:rgba(255,255,255,.18); font-size:.9rem; line-height:1.4; }

  /* search field: a recessed slot, the one place on the page that is pressed in by default */
  #q { width:100%; font:inherit; font-size:18px; font-weight:500; padding:14px 16px; border-radius:12px; border:2px solid var(--line);
       background:var(--tile); color:var(--text); box-shadow:inset 0 3px 0 rgba(0,0,0,.06); }
  #q::placeholder { color:var(--muted); font-weight:400; }
  #q:focus { outline:0; border-color:var(--yellow); }
  .list { display:flex; flex-direction:column; gap:12px; margin-top:14px; }
  .pick { text-align:start; background:var(--tile); color:var(--text); padding:12px 14px 10px; min-height:48px; font-size:1.05rem; }

  .row { display:flex; gap:8px; overflow-x:auto; margin:4px -16px 0; padding:2px 18px 12px; scrollbar-width:none; }
  .row::-webkit-scrollbar { display:none; }
  .chip { flex:none; background:var(--tile); color:var(--text); padding:9px 14px 7px; line-height:1.2; min-height:48px; position:relative; }
  .chip small { display:block; font-size:.7rem; font-weight:400; color:var(--muted); font-variant-numeric:tabular-nums; }
  .chip[aria-pressed=true] { background:var(--yellow); color:var(--ink); --e:var(--yellow-edge); --hi:rgba(255,255,255,.5); }
  .chip[aria-pressed=true] small { color:var(--ink); }
  /* a small lamp on the hours this teacher has a lesson */
  .chip.has::after { content:""; position:absolute; top:-3px; inset-inline-end:-3px; width:10px; height:10px; border-radius:50%; border:2px solid var(--bg);
                     background:radial-gradient(circle at 35% 30%,var(--lamp-hi),var(--lamp) 60%,var(--lamp-lo)); box-shadow:0 0 6px rgba(23,178,106,.7); }

  /* the answer: a sign plate. Room number at sign scale, a lamp while the teacher is in a lesson */
  .card { background:var(--tile); border-radius:14px; padding:16px 16px 18px; margin-top:12px; position:relative;
          box-shadow:inset 0 1px 0 var(--hi), 0 5px 0 var(--edge), 0 10px 12px -6px rgba(0,0,0,.3); }
  .card .who { font-size:1.15rem; font-weight:700; padding-inline-end:40px; }
  .card .where { margin:10px 0 4px; font-weight:700; font-size:1.4rem; }
  .card .where .rn { display:block; font:700 5.5rem/.8 var(--display); letter-spacing:.02em; font-variant-numeric:tabular-nums; }
  .card .where small { display:block; font-size:.9rem; font-weight:500; color:var(--muted); margin-top:6px; }
  .card .lamp { position:absolute; inset-inline-end:16px; top:16px; width:26px; height:26px; border-radius:50%;
                background:radial-gradient(circle at 35% 30%,var(--lamp-hi),var(--lamp) 55%,var(--lamp-lo)); box-shadow:0 0 0 3px var(--bg), 0 2px 10px 1px rgba(23,178,106,.7); }
  .card.off .lamp { background:none; box-shadow:inset 0 0 0 4px var(--muted); opacity:.6; }
  .card.off .where { color:var(--muted); }
  .card .sub { color:var(--muted); font-size:.9rem; font-variant-numeric:tabular-nums; }
  .card .next { margin-top:14px; padding-top:12px; border-top:3px solid var(--yellow); font-size:.95rem; font-weight:500; }
  .card button { margin-top:16px; min-height:44px; padding:8px 14px; background:var(--bg); color:var(--text); font-size:.9rem; }

  @media (prefers-reduced-motion: no-preference) {
    .enter .card { animation:rise 260ms var(--out) backwards; }
    .enter .card .lamp { animation:light 420ms var(--out) 90ms backwards; }
    .enter .card .rn { animation:roll 300ms var(--out) 40ms backwards; }
    .list .pick { animation:rise 200ms var(--out) backwards; animation-delay:calc(var(--i,0) * 25ms); }
  }
  @media (prefers-reduced-motion: reduce) { button, .hk { transition:none; } }
  @keyframes rise { from { opacity:0; transform:translateY(8px); } }
  @keyframes light { from { transform:scale(.4); opacity:.2; } }
  @keyframes roll { from { opacity:0; transform:translateY(30%); } }
</style>
</head>
<body>
<main>
  <header>
    <a class="hk back" href="./">חזרה לכיתות פנויות</a>
    <h1>איפה המורה?</h1>
    <div class="now" id="now"></div>
  </header>
  <input id="q" type="search" placeholder="הקלידו שם של מורה…" autocomplete="off" aria-label="שם המורה">
  <div id="result" aria-live="polite"></div>
  <p class="muted" id="updated"></p>
</main>
<script>
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayIso = () => iso(new Date());
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const el = (tag, props, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

// "ט1 104*" -> "חדר 104 · ט1" (same idea as show() in index.html)
function roomText(room) {
  const clean = room.replace(/[*+\-\s]+$/,'').replace(/\s+-\s+/,' ');
  const m = clean.match(/^(.*?)\s*(\d{3})\b(.*)$/);
  if (!m) return clean;
  const label = (m[1] + m[3]).trim();
  return `חדר ${m[2]}` + (label ? ` · ${label}` : '');
}
// "ט1 104*" -> number on its own line at sign scale, the class label under it
function roomSign(room) {
  const clean = room.replace(/[*+\-\s]+$/,'').replace(/\s+-\s+/,' ');
  const m = clean.match(/^(.*?)\s*(\d{3})\b(.*)$/);
  if (!m) return [clean];
  const label = (m[1] + m[3]).trim();
  return [el('span', { className: 'rn' }, m[2]), el('small', {}, label ? `כיתת ${label}` : 'חדר')];
}
// match every typed word anywhere in the name, ignoring quotes/dashes ("בן נון" finds "בן-נון")
const norm = s => s.replace(/["'׳״\-()]/g, ' ').replace(/\s+/g, ' ').trim();
const matches = (name, q) => norm(q).split(' ').every(w => norm(name).includes(w));

let data, names = [], picked = null, fresh = false;
let at = null; // hour key the user chose for today, or null = right now (the default)
const q = document.getElementById('q'), res = document.getElementById('result');

const todayHours = () => {
  const h = data.days[todayIso()]?.hours ?? {};
  return [h, Object.keys(h).sort((a, b) => a - b)];
};

function header() {
  const [h, keys] = todayHours();
  const t = nowHM(), cur = keys.find(k => h[k].start <= t && t < h[k].end);
  const now = document.getElementById('now');
  if (cur) now.replaceChildren(`שעה ${cur}`, el('small', {}, `עכשיו · עד ${h[cur].end}`)); else now.replaceChildren();
}

function renderList() {
  picked = null;
  res.classList.remove('enter');
  const v = q.value.trim();
  if (!v) { res.replaceChildren(); return; }
  const hits = names.filter(n => matches(n, v)).slice(0, 8);
  if (!hits.length) { res.replaceChildren(el('div', { className: 'card' }, 'לא מצאתי מורה בשם הזה. נסו חלק מהשם.')); return; }
  res.replaceChildren(el('div', { className: 'list' }, ...hits.map((n, i) => { const b = el('button', { type: 'button', className: 'pick', onclick: () => pick(n) }, n); b.style.setProperty('--i', i); return b; })));
}

function pick(name) {
  picked = name;
  at = null;
  q.value = name;
  q.blur();
  store.set('lastTeacher', name);
  fresh = true;
  renderTeacher();
}

// "עכשיו" + one chip per hour of today; a dot marks hours this teacher has a lesson
function hourChips(h, keys) {
  const chip = (key, main, sub, has) => {
    const b = el('button', { type: 'button', className: 'chip' + (has ? ' has' : ''), onclick: () => { at = key; fresh = true; renderTeacher(); } },
      main, el('small', {}, sub));
    b.setAttribute('aria-pressed', key === at);
    return b;
  };
  const row = el('div', { className: 'row', role: 'group', ariaLabel: 'בחירת שעה' },
    chip(null, 'עכשיו', nowHM(), false),
    ...keys.map(k => chip(k, `שעה ${k}`, h[k].start, picked in h[k].teachers)));
  requestAnimationFrame(() => row.querySelector('[aria-pressed=true]')?.scrollIntoView({ inline: 'center', block: 'nearest' }));
  return row;
}

// Only today. Default: where the teacher is right now, or (if not in a lesson) their next lesson today.
// With an hour chosen: where the teacher is at that hour. Other days are never shown.
function renderTeacher() {
  res.classList.toggle('enter', fresh);
  fresh = false;
  const [h, keys] = todayHours();
  if (at && !h[at]) at = null; // the day changed under us
  const row = keys.length ? hourChips(h, keys) : '';
  if (at) {
    const room = h[at].teachers[picked], here = picked in h[at].teachers;
    const kids = [el('span', { className: 'lamp', ariaHidden: 'true' }), el('div', { className: 'who' }, picked),
      el('div', { className: 'where' }, ...(here ? (room ? roomSign(room) : ['בשיעור, בלי חדר קבוע']) : ['אין שיעור בשעה הזו'])),
      el('div', { className: 'sub' }, `היום, שעה ${at} · ${h[at].start}–${h[at].end}` + (here && !room ? ' (למשל חינוך גופני)' : ''))];
    kids.push(el('button', { type: 'button', onclick: () => { at = null; fresh = true; renderTeacher(); } }, 'חזרה לעכשיו'));
    res.replaceChildren(row, el('div', { className: 'card' + (here ? '' : ' off') }, ...kids));
    return;
  }
  const t = nowHM();
  const cur = keys.find(k => h[k].start <= t && t < h[k].end);
  const here = cur && picked in h[cur].teachers;
  const next = keys.find(k => h[k].start > t && picked in h[k].teachers);
  const kids = [el('span', { className: 'lamp', ariaHidden: 'true' }), el('div', { className: 'who' }, picked)];
  if (here) {
    const room = h[cur].teachers[picked];
    kids.push(el('div', { className: 'where' }, ...(room ? roomSign(room) : ['בשיעור, בלי חדר קבוע'])));
    kids.push(el('div', { className: 'sub' }, `שעה ${cur} · עד ${h[cur].end}` + (room ? '' : ' (למשל חינוך גופני)')));
  } else {
    kids.push(el('div', { className: 'where' }, 'לא בשיעור עכשיו'));
    if (data.days[todayIso()]?.holiday) kids.push(el('div', { className: 'sub' }, data.days[todayIso()].holiday));
  }
  if (next && next !== cur) {
    const room = h[next].teachers[picked];
    kids.push(el('div', { className: 'next' }, `השיעור הבא היום: שעה ${next} (${h[next].start}) · ${room ? roomText(room) : 'בלי חדר קבוע'}`));
  } else if (!here) {
    kids.push(el('div', { className: 'next' }, 'אין עוד שיעורים היום לפי המערכת.'));
  }
  kids.push(el('button', { type: 'button', onclick: () => { q.value = ''; q.focus(); renderList(); } }, 'חיפוש מורה אחר'));
  res.replaceChildren(row, el('div', { className: 'card' + (here ? '' : ' off') }, ...kids));
}

function render() { header(); if (picked) renderTeacher(); else renderList(); }

async function load() {
  try {
    data = await fetch('data.json', { cache: 'no-cache' }).then(r => r.json());
  } catch {
    document.getElementById('updated').textContent = 'לא הצלחתי לטעון נתונים. בדוק חיבור לאינטרנט.';
    return;
  }
  const all = new Set();
  for (const d of Object.values(data.days)) for (const hr of Object.values(d.hours)) for (const n of Object.keys(hr.teachers ?? {})) all.add(n);
  names = [...all].sort((a, b) => a.localeCompare(b, 'he'));
  const u = new Date(data.updated);
  document.getElementById('updated').textContent =
    `לפי מערכת השעות והשינויים בשחף, עודכן ב-${u.getDate()}.${u.getMonth()+1} ${pad(u.getHours())}:${pad(u.getMinutes())}. ייתכן שהמורה בפועל במקום אחר.`;
  const last = store.get('lastTeacher');
  if (!picked && !q.value && last && all.has(last)) picked = last, q.value = last;
  render();
}

q.addEventListener('input', renderList);
q.addEventListener('keydown', e => { if (e.key === 'Enter') res.querySelector('.list button')?.click(); });
load();
setInterval(() => { if (!document.hidden && data) render(); }, 30e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
