<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>כיתה פנויה</title>
<meta name="theme-color" content="#1546c0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="כיתה פנויה">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Karantina:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#e9ebee; --tile:#fff; --edge:#b7bec8; --text:#14181f; --muted:#555e6c; --line:#cfd4db;
          --blue:#1546c0; --blue-edge:#0c2c80; --yellow:#f4c20d; --yellow-edge:#a98600; --ink:#14181f;
          --lamp:#17b26a; --lamp-hi:#b6ffd8; --lamp-lo:#0c7a47; --asphalt:#14181f; --cell:#242b37; --dim:#aab2bf; --count:#3fe08f;
          --mine:#fff3bf; --hi:rgba(255,255,255,.7);
          --display:Karantina,"Arial Narrow",system-ui,sans-serif; --press:90ms; --out:cubic-bezier(.16,1,.3,1); }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1218; --tile:#1f2530; --edge:#05070a; --text:#eef0f3; --muted:#a3abb8; --line:#2c3440;
          --asphalt:#05070a; --cell:#1f2530; --mine:#3a3210; --hi:rgba(255,255,255,.07); } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { scroll-behavior:smooth; accent-color:var(--blue); caret-color:var(--blue); }
  ::selection { background:var(--yellow); color:var(--ink); }
  :focus-visible { outline:3px solid var(--yellow); outline-offset:2px; }
  body { margin:0; font-family:Heebo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--text); line-height:1.35; }
  main { max-width:560px; margin:0 auto; padding:0 16px max(32px,env(safe-area-inset-bottom)); }

  /* header: the sign itself. Blue plate closed by a line-paint hazard strip. */
  header { background:var(--blue); color:#fff; margin:0 -16px; padding:max(18px,env(safe-area-inset-top)) 18px 22px; position:relative;
           display:grid; grid-template-columns:1fr auto; gap:4px 12px; align-items:start; }
  header::after { content:""; position:absolute; inset:auto 0 0; height:8px;
                  background:repeating-linear-gradient(-45deg,var(--yellow) 0 12px,var(--ink) 12px 24px); }
  header h1 { font:700 3.4rem/.85 var(--display); margin:0; letter-spacing:.01em; }
  header .today { font-size:.95rem; grid-column:1; color:#dbe4ff; }
  header .now { grid-column:2; grid-row:1 / span 2; background:var(--ink); color:var(--yellow); border-radius:8px; padding:8px 12px 6px; text-align:center;
                font:700 2rem/.9 var(--display); box-shadow:inset 0 1px 0 rgba(255,255,255,.15), 0 3px 6px -2px rgba(0,0,0,.5); }
  header .now small { display:block; font:500 .7rem/1.4 Heebo,system-ui,sans-serif; color:#fff; }
  header .now[hidden], #install[hidden] { display:none; }
  header .inst { grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }

  .muted { color:var(--muted); font-size:.8rem; }
  .row { display:flex; gap:8px; overflow-x:auto; margin:6px -16px 0; padding:2px 18px 12px; scrollbar-width:none; }
  .row::-webkit-scrollbar { display:none; }
  #days { margin-top:18px; }

  /* keys: every control is a moulded key with a lower edge; pressing travels it down onto the edge */
  button { font-family:inherit; font-size:16px; cursor:pointer; user-select:none; border:0; color:inherit;
           transition:transform var(--press) var(--out), box-shadow var(--press) var(--out), background-color 120ms; }
  .chip, .go, .hk, dialog .btns button { --e:var(--edge); border-radius:10px; font-weight:700;
           box-shadow:inset 0 1px 0 var(--hi), 0 4px 0 var(--e), 0 8px 10px -5px rgba(0,0,0,.35); }
  .chip:active, .go:active, .hk:active, dialog .btns button:active, .chip[aria-pressed=true] {
           transform:translateY(3px); box-shadow:inset 0 1px 0 var(--hi), 0 1px 0 var(--e), 0 2px 3px -1px rgba(0,0,0,.3); }
  .chip { flex:none; background:var(--tile); color:var(--text); padding:9px 14px 7px; line-height:1.2; min-height:48px; }
  .chip small { display:block; font-size:.7rem; font-weight:400; color:var(--muted); font-variant-numeric:tabular-nums; }
  .chip[aria-pressed=true] { background:var(--yellow); color:var(--ink); --e:var(--yellow-edge); --hi:rgba(255,255,255,.5); }
  .chip[aria-pressed=true] small { color:var(--ink); }
  /* header keys stay quiet on the blue: yellow is reserved for selection and rules */
  .hk { display:inline-block; padding:9px 16px; background:#0f378f; color:#fff; --e:#082260; --hi:rgba(255,255,255,.18); font-size:.9rem; line-height:1.4; text-decoration:none;
        transition:transform var(--press) var(--out), box-shadow var(--press) var(--out); }

  /* counter board: the sign at the garage entrance. One cell per floor, free count in lamp green. */
  .board { background:var(--asphalt); color:#fff; border-radius:14px; padding:6px; margin-top:10px;
           box-shadow:0 10px 16px -10px rgba(0,0,0,.6); }
  .total { display:flex; align-items:baseline; gap:10px; padding:6px 12px 4px; font-weight:500; }
  .total b { font:700 3.6rem/.85 var(--display); color:var(--count); font-variant-numeric:tabular-nums; }
  .lvls { display:flex; gap:6px; }
  .lv { flex:1; min-width:0; background:var(--cell); border-radius:9px; padding:8px 10px 6px; display:flex; justify-content:space-between; align-items:flex-end;
        margin-bottom:3px; box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 3px 0 #000; }
  .lv:active { transform:translateY(2px); box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 1px 0 #000; background:var(--blue); }
  .lv span { font:700 2.5rem/.85 var(--display); text-align:center; font-variant-numeric:tabular-nums; }
  .lv small { display:block; font:500 .65rem/1.5 Heebo,system-ui,sans-serif; color:var(--dim); }
  .lv .fl { color:var(--dim); } .lv .cnt { color:var(--count); }

  h2 { font-size:.95rem; margin:26px 2px 10px; font-weight:700; display:flex; align-items:center; gap:10px; scroll-margin-top:12px; }
  h2::after { content:""; flex:1; height:3px; background:var(--yellow); border-radius:2px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px 10px; }

  /* room tile: number is the only headline; the lamp's size says how long the room stays free */
  .room { background:var(--tile); border-radius:12px; padding:10px 12px 12px; display:flex; flex-direction:column; position:relative;
          box-shadow:inset 0 1px 0 var(--hi), 0 5px 0 var(--edge), 0 10px 12px -6px rgba(0,0,0,.3); }
  .room .num { font:700 3.6rem/.85 var(--display); letter-spacing:.02em; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; padding-inline-end:30px; }
  .room .sub { font-size:.78rem; color:var(--muted); min-height:1.1em; }
  .room .until { font-size:.85rem; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums; }
  .lamp { position:absolute; inset-inline-end:12px; top:12px; width:var(--s,18px); height:var(--s,18px); border-radius:50%;
          background:radial-gradient(circle at 35% 30%,var(--lamp-hi),var(--lamp) 55%,var(--lamp-lo));
          box-shadow:0 0 0 3px var(--bg), 0 2px 10px 1px rgba(23,178,106,.7); }
  .go { margin-top:10px; min-height:44px; padding:8px; background:var(--blue); color:#fff; --e:var(--blue-edge); --hi:rgba(255,255,255,.25); font-size:.9rem; }
  .room.taken { background:var(--mine); }
  .room.taken .lamp { background:none; box-shadow:inset 0 0 0 4px var(--yellow-edge); }
  .rel { margin-top:6px; min-height:44px; align-self:flex-start; background:none; padding:4px 2px; font-size:.85rem; font-weight:500; text-decoration:underline; text-underline-offset:3px; }
  .rel:active { transform:translateY(1px); }
  .note { background:var(--tile); border-radius:12px; padding:14px; margin-top:14px; font-weight:500; box-shadow:0 0 0 2px var(--yellow) inset; }
  #updated { margin-top:26px; }

  dialog { border:0; border-radius:14px; padding:20px; background:var(--tile); color:var(--text); width:min(320px,90vw); box-shadow:0 24px 40px -12px rgba(0,0,0,.6); }
  dialog::backdrop { background:rgba(8,10,14,.6); }
  dialog b { font:700 1.9rem/1 var(--display); display:block; margin-bottom:4px; }
  dialog li b { font:inherit; font-weight:700; display:inline; margin:0; }
  dialog input { width:100%; font:inherit; font-size:16px; padding:10px 12px; border-radius:10px; border:2px solid var(--line); background:var(--bg); color:var(--text); margin:10px 0 16px; }
  dialog input:focus { border-color:var(--blue); }
  dialog .btns { display:flex; gap:8px; padding-bottom:4px; }
  dialog .btns button { flex:1; min-height:44px; padding:10px; background:var(--blue); color:#fff; --e:var(--blue-edge); --hi:rgba(255,255,255,.25); }
  dialog .btns button[value=cancel] { background:var(--bg); color:var(--text); --e:var(--edge); --hi:transparent; }
  #installDialog ol { padding-inline-start:20px; margin:10px 0 16px; line-height:1.9; }
  .ic { width:1.25em; height:1.25em; vertical-align:-.25em; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  /* motion: runs once when the day or hour changes (class set in render), never on background refreshes */
  @media (prefers-reduced-motion: no-preference) {
    .enter .in { animation:rise 260ms var(--out) backwards; animation-delay:calc(min(var(--i,0),10) * 22ms); }
    .enter .in .lamp { animation:light 420ms var(--out) backwards; animation-delay:calc(90ms + min(var(--i,0),10) * 22ms); }
    .enter .total b, .enter .lv .cnt { animation:roll 300ms var(--out) backwards; }
    dialog[open] { animation:rise 200ms var(--out); }
    dialog[open]::backdrop { animation:fade 200ms ease-out; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior:auto; } button { transition:none; } }
  @keyframes rise { from { opacity:0; transform:translateY(8px); } }
  @keyframes light { from { transform:scale(.4); opacity:.2; } }
  @keyframes roll { from { opacity:0; transform:translateY(40%); } }
  @keyframes fade { from { opacity:0; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>כיתה פנויה</h1>
    <div class="now" id="now" hidden></div>
    <div class="today" id="today"></div>
    <div class="inst"><button id="install" class="hk" hidden>הורד לטלפון</button><a id="teacherLink" class="hk" href="teacher.html">איפה המורה?</a></div>
  </header>
  <div class="row" id="days" role="group" aria-label="בחירת יום"></div>
  <div class="row" id="hours" role="group" aria-label="בחירת שעה"></div>
  <div id="result" aria-live="polite"></div>
  <p class="muted" id="updated"></p>
</main>
<dialog id="nameDialog">
  <form method="dialog">
    <b>איך קוראים לך?</b>
    <div class="muted">החדר שתפסת לא יופיע יותר לאחרים ברשימת הפנויים</div>
    <input id="nameInput" maxlength="20" required autocomplete="nickname">
    <div class="btns"><button value="ok">תפוס</button><button value="cancel" formnovalidate>ביטול</button></div>
  </form>
</dialog>
<dialog id="installDialog">
  <form method="dialog">
    <b>איך מורידים לטלפון</b>
    <ol id="installSteps"></ol>
    <div class="btns"><button value="ok">הבנתי</button></div>
  </form>
</dialog>
<script>
// Firebase Realtime Database URL for room claims (see README). Empty = app works without claiming.
const DB_URL = 'https://free-room-4c651-default-rtdb.europe-west1.firebasedatabase.app';
// Google Analytics measurement ID, like 'G-ABC123' (see README). Empty = no analytics.
const GA_ID = 'G-1BV6Q54MZW';
// Firebase Web API key (Project settings → General → Your apps). It's public by design: the database rules do the protecting.
// Empty = no claiming (the rules reject writes from anyone who isn't signed in).
const API_KEY = 'AIzaSyD4vVpPQHvb7Ud7l22rfhJCyBd61uk6_vk';
if (GA_ID) {
  document.head.append(Object.assign(document.createElement('script'), { async: true, src: 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID }));
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { dataLayer.push(arguments); };
  gtag('js', new Date());
  gtag('config', GA_ID);
}

const DAY = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const MONTH = ['בינואר','בפברואר','במרץ','באפריל','במאי','ביוני','ביולי','באוגוסט','בספטמבר','באוקטובר','בנובמבר','בדצמבר'];
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayIso = () => iso(new Date());
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const canClaim = DB_URL && API_KEY;

// Firebase anonymous sign-in over REST: every device gets its own account, no sign-up. me = {id (token), refresh, uid, exp}
let me = (() => { try { return JSON.parse(store.get('auth')); } catch { return null; } })();
async function auth() {
  if (me?.id && me.exp > Date.now() + 60e3) return me;
  const post = (url, body, type) => fetch(url, { method: 'POST', headers: { 'content-type': type }, body }).then(r => r.json());
  let j = me?.refresh && await post(`https://securetoken.googleapis.com/v1/token?key=${API_KEY}`,
    `grant_type=refresh_token&refresh_token=${encodeURIComponent(me.refresh)}`, 'application/x-www-form-urlencoded');
  j = j?.id_token ? { id: j.id_token, refresh: j.refresh_token, uid: j.user_id, exp: j.expires_in }
    : await post(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${API_KEY}`, '{"returnSecureToken":true}', 'application/json')
        .then(j => ({ id: j.idToken, refresh: j.refreshToken, uid: j.localId, exp: j.expiresIn }));
  if (!j.id) throw new Error('sign-in failed');
  me = { ...j, exp: Date.now() + j.exp * 1000 };
  store.set('auth', JSON.stringify(me));
  return me;
}
const withAuth = (url, a) => `${url}?auth=${encodeURIComponent(a.id)}`;
// "I'm here" ping, so the owner's bot can see who is on the site right now
async function ping() {
  if (!canClaim || document.hidden) return;
  const a = await auth().catch(() => null);
  if (a) fetch(withAuth(`${DB_URL}/online/${a.uid}.json`, a), { method: 'PUT',
    body: JSON.stringify({ by: store.get('name') || '', at: { '.sv': 'timestamp' } }) }).catch(() => {});
}

// "ט1 104*" -> {num:"104", label:"ט1", floor:"1"}; rooms without a 3-digit number are "special" (floor null)
function show(room) {
  const clean = room.replace(/[*+\-\s]+$/,'').replace(/\s+-\s+/,' ');
  const m = clean.match(/^(.*?)\s*(\d{3})\b(.*)$/);
  return m ? { num: m[2], label: (m[1] + m[3]).trim(), floor: m[2][0] } : { num: clean, label: '', floor: null };
}
// regular classrooms only: numbered, not in the basement labs (floor 0), not a lab by name
const regular = r => { const s = show(r); return s.floor && s.floor !== '0' && !/מעבד|מע'/.test(r); };
const MAX_PER_DAY = 2; // keep in sync with bot.mjs
const dbKey = r => r.replace(/[.#$\[\]\/]/g, '_');

let data, day, hour, claims = {};
const el = (tag, props, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
const hoursOf = d => { const h = data.days[d]?.hours ?? {}; return [h, Object.keys(h).sort((a,b) => a - b)]; };

// today if school isn't over yet, otherwise the next day that has a timetable
function pickDay() {
  const days = Object.keys(data.days).filter(d => d >= todayIso()).sort();
  const [h, keys] = hoursOf(todayIso());
  const lastBusy = keys.filter(k => h[k].busy.length).pop();
  if (days[0] === todayIso() && lastBusy && h[lastBusy].end > nowHM()) return days[0];
  return days.find(d => d > todayIso()) ?? days[0];
}
// the lesson running now (or the next one); on other days the first hour with lessons
function pickHour() {
  const [h, keys] = hoursOf(day);
  if (day !== todayIso()) return keys.find(k => h[k].busy.length) ?? keys[0];
  return keys.find(k => h[k].busy.length && h[k].end > nowHM()) ?? keys[keys.length - 1];
}

function chips(box, items, current, onPick) {
  box.replaceChildren(...items.map(([key, main, sub]) => {
    const b = el('button', { className: 'chip', type: 'button', onclick: () => onPick(key) }, main, sub ? el('small', {}, sub) : '');
    b.setAttribute('aria-pressed', key === current);
    return b;
  }));
  box.querySelector('[aria-pressed=true]')?.scrollIntoView({ inline: 'center', block: 'nearest' });
}

function renderHeader() {
  const n = new Date();
  document.getElementById('today').textContent = `היום יום ${DAY[n.getDay()]}, ${n.getDate()} ${MONTH[n.getMonth()]}`;
  const [h, keys] = hoursOf(todayIso());
  const t = nowHM(), cur = keys.find(k => h[k].start <= t && t < h[k].end);
  const now = document.getElementById('now');
  now.hidden = !cur;
  if (cur) now.replaceChildren(`שעה ${cur}`, el('small', {}, `עכשיו · עד ${h[cur].end}`));
}

function render() {
  renderHeader();
  const tomorrow = iso(new Date(Date.now() + 864e5));
  chips(document.getElementById('days'), Object.keys(data.days).filter(d => d >= todayIso()).sort().map(d => {
    const dt = new Date(d + 'T12:00');
    return [d, d === todayIso() ? 'היום' : d === tomorrow ? 'מחר' : DAY[dt.getDay()], `${dt.getDate()}.${dt.getMonth()+1}`];
  }), day, d => select(d, null));

  const [hours, keys] = hoursOf(day);
  chips(document.getElementById('hours'), keys.map(h => [h, `שעה ${h}`, hours[h].start]), hour, h => select(day, h));

  const res = document.getElementById('result');
  if (!hours[hour]) { res.replaceChildren(el('div', { className: 'note' }, 'אין מערכת ליום הזה.')); return; }
  const busy = new Set(hours[hour].busy);
  const free = data.rooms.filter(r => regular(r) && !busy.has(r));
  const later = keys.filter(h => +h > +hour);
  // [time the room stays free until, number of lessons in a row it is free]
  const until = r => { let end = hours[hour].end, n = 1; for (const h of later) { if (hours[h].busy.includes(r)) break; end = hours[h].end; n++; } return [end, n]; };
  const open = free.filter(r => !claims[dbKey(r)]);
  // rooms claimed by others are hidden entirely; your own claim stays so you can release it
  const shown = free.filter(r => !claims[dbKey(r)] || claims[dbKey(r)].id === me?.uid);

  const out = [];
  if (data.days[day].holiday) out.push(el('div', { className: 'note' }, data.days[day].holiday));
  const floors = {};
  for (const r of shown) (floors[show(r).floor] ??= []).push(r);
  const fkeys = Object.keys(floors).sort();
  // counter board: total, then one cell per floor that jumps to that floor
  out.push(el('div', { className: 'board' },
    el('div', { className: 'total' }, el('b', {}, open.length), 'חדרים פנויים'),
    el('div', { className: 'lvls' }, ...fkeys.map(f => {
      const n = floors[f].filter(r => !claims[dbKey(r)]).length;
      return el('button', { className: 'lv', type: 'button', ariaLabel: `קומה ${f}, ${n} פנויים`,
        onclick: () => document.getElementById('f' + f).scrollIntoView() },
        el('span', { className: 'fl' }, f, el('small', {}, 'קומה')), el('span', { className: 'cnt' }, n, el('small', {}, 'פנויים')));
    }))));
  let i = 0;
  for (const f of fkeys) {
    out.push(el('h2', { id: 'f' + f }, `קומה ${f}`));
    out.push(el('div', { className: 'grid' }, ...floors[f].sort((a,b) => show(a).num.localeCompare(show(b).num)).map(r => card(r, ...until(r), i++))));
  }
  if (!shown.length) out.push(el('div', { className: 'note' }, 'אין כיתות פנויות בשעה הזו'));
  res.classList.toggle('enter', fresh); // entrance motion only after the user picked a day/hour, not on background refreshes
  fresh = false;
  res.replaceChildren(...out);
}

function card(r, untilTime, lessons, i) {
  const s = show(r), c = claims[dbKey(r)];
  // lamp grows with the number of lessons the room stays free (15px for one, up to 30px)
  const kids = [el('span', { className: 'lamp', style: `--s:${12 + Math.min(lessons, 6) * 3}px` }),
    el('div', { className: 'num' }, s.num), el('div', { className: 'sub' }, s.label ? `כיתת ${s.label}` : ' ')];
  if (c) { // only your own claims reach here
    kids.push(el('div', { className: 'until' }, 'תפסת את החדר'));
    kids.push(el('button', { className: 'rel', type: 'button', onclick: () => unclaim(r) }, 'שחרר'));
  } else {
    kids.push(el('div', { className: 'until' }, 'פנוי עד ' + untilTime));
    if (canClaim) kids.push(el('button', { className: 'go', type: 'button', onclick: () => claim(r) }, 'אני הולך/ת לשם'));
  }
  const e = el('div', { className: 'room' + (c ? ' taken' : '') + (i < 12 ? ' in' : '') }, ...kids);
  e.style.setProperty('--i', i);
  return e;
}

let fresh = false;
function select(d, h) { day = d; hour = h ?? pickHour(); claims = {}; fresh = true; render(); refreshClaims(); }

const claimUrl = (r = '', h = hour) => `${DB_URL}/claims/${day}/${h}${r && '/' + encodeURIComponent(dbKey(r))}.json`;
async function refreshClaims() {
  if (!DB_URL || !data) return;
  const [d, h] = [day, hour];
  try {
    const dayClaims = await fetch(`${DB_URL}/claims/${d}.json`).then(r => r.json()) || {};
    // a claim holds the room from its hour until the end of the day
    const got = {};
    for (const [ch, rooms] of Object.entries(dayClaims)) if (+ch <= +h) for (const [k, c] of Object.entries(rooms || {})) got[k] ??= { ...c, h: ch };
    // ignore answers for a slot the user already left; re-render only on a real change (a rebuild resets scroll, taps and motion)
    if (d === day && h === hour && JSON.stringify(got) !== JSON.stringify(claims)) { claims = got; render(); }
  } catch {}
}

function askName() {
  const dlg = document.getElementById('nameDialog'), input = document.getElementById('nameInput');
  input.value = store.get('name') || '';
  dlg.showModal();
  return new Promise(res => dlg.addEventListener('close', () => {
    const name = input.value.trim().slice(0, 20);
    if (dlg.returnValue === 'ok' && name) { store.set('name', name); res(name); } else res(null);
  }, { once: true }));
}

async function claim(r) {
  const name = store.get('name') || await askName();
  if (!name) return;
  const a = await auth().catch(() => null);
  if (!a) return alert('לא הצלחתי להתחבר – בדוק חיבור לאינטרנט ונסה שוב.');
  // shortcut: limit is checked here and enforced by the bot (rules can't count), clearing site data gets a new account
  const dayClaims = await fetch(`${DB_URL}/claims/${day}.json`).then(x => x.json()).catch(() => null) || {};
  const mine = Object.values(dayClaims).flatMap(h => Object.values(h || {})).filter(c => c.id === a.uid).length;
  if (mine >= MAX_PER_DAY) return alert(`אפשר לתפוס עד ${MAX_PER_DAY} כיתות ביום. שחרר/י כיתה אחרת קודם.`);
  // the database rules only allow writing to an empty slot, so two people can't claim the same room
  const status = await fetch(withAuth(claimUrl(r), a), { method: 'PUT', body: JSON.stringify({ by: name, id: a.uid, at: { '.sv': 'timestamp' } }) })
    .then(x => x.status).catch(() => 0);
  if (status === 200) window.gtag?.('event', 'claim_room');
  if (status === 401) alert('מישהו תפס את החדר הזה רגע לפני');
  else if (status !== 200) alert('לא הצלחתי לתפוס – בדוק חיבור לאינטרנט ונסה שוב.');
  refreshClaims();
}
async function unclaim(r) {
  const a = await auth().catch(() => null);
  if (a) await fetch(withAuth(claimUrl(r, claims[dbKey(r)]?.h), a), { method: 'DELETE' }).catch(() => {});
  refreshClaims();
}

async function load() {
  try {
    data = await fetch('data.json', { cache: 'no-cache' }).then(r => r.json());
  } catch {
    document.getElementById('updated').textContent = 'לא הצלחתי לטעון נתונים. בדוק חיבור לאינטרנט.';
    return;
  }
  const u = new Date(data.updated);
  document.getElementById('updated').textContent =
    `המערכת עודכנה משחף ב-${u.getDate()}.${u.getMonth()+1} ${pad(u.getHours())}:${pad(u.getMinutes())}. חדר שנראה פנוי עדיין יכול להיות תפוס בפועל.`;
  select(pickDay(), null);
  ping();
}
setInterval(ping, 60e3);
load();
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
setInterval(() => { if (!document.hidden) refreshClaims(); }, 20000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

// Install button: Android/Chrome installs directly via beforeinstallprompt; iPhone can't, so show steps.
const installBtn = document.getElementById('install');
const icon = (label, d) => `<svg class="ic" viewBox="0 0 24 24" role="img" aria-label="${label}"><path d="${d}"/></svg>`;
const SHARE = icon('שיתוף', 'M12 15V3m-4 4 4-4 4 4M7 11H5v10h14V11h-2'), MENU = icon('תפריט', 'M12 5v.01M12 12v.01M12 19v.01');
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let installEvt = null;
if (!matchMedia('(display-mode: standalone)').matches && !navigator.standalone) installBtn.hidden = false;
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; });
addEventListener('appinstalled', () => { installBtn.hidden = true; });
installBtn.onclick = async () => {
  if (installEvt) {
    installEvt.prompt();
    if ((await installEvt.userChoice).outcome === 'accepted') installBtn.hidden = true;
    installEvt = null;
    return;
  }
  document.getElementById('installSteps').innerHTML = isIOS
    // Chrome on iOS (CriOS) can add to home screen too since iOS 16.4; its share button sits in the address bar.
    ? (/CriOS/.test(navigator.userAgent)
        ? `<li>לחצו על כפתור השיתוף ${SHARE} בשורת הכתובת למעלה</li>`
        : `<li>לחצו על כפתור השיתוף ${SHARE} בתחתית המסך</li>`)
      + '<li>גללו ובחרו <b>"הוסף למסך הבית"</b></li><li>לחצו <b>"הוסף"</b></li>'
    : `<li>פתחו את האתר ב-<b>Chrome</b></li><li>לחצו על ${MENU} למעלה</li><li>בחרו <b>"התקנת אפליקציה"</b> או <b>"הוספה למסך הבית"</b></li>`;
  document.getElementById('installDialog').showModal();
};
</script>
</body>
</html>
