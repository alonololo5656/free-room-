<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>כיתה פנויה</title>
<meta name="theme-color" content="#4338ca">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="כיתה פנויה">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f3f4fa; --card:#fff; --text:#111322; --muted:#6b6f85; --accent:#4338ca; --accent2:#7c3aed;
          --line:#e6e7f0; --ok:#059669; --okbg:#ecfdf5; --warn:#b45309; --warnbg:#fffbeb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0c0d16; --card:#171927; --text:#eceef8; --muted:#9a9db3; --accent:#818cf8;
          --accent2:#a78bfa; --line:#272a3d; --ok:#34d399; --okbg:#0f2a22; --warn:#fbbf24; --warnbg:#2b2210; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:Rubik,system-ui,-apple-system,"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:560px; margin:0 auto; padding:0 16px max(32px,env(safe-area-inset-bottom)); }
  header { background:linear-gradient(135deg,#4338ca,#7c3aed); color:#fff; padding:max(20px,env(safe-area-inset-top)) 20px 22px;
           border-radius:0 0 28px 28px; margin:0 -16px 16px; }
  header h1 { font-size:1.6rem; margin:0; font-weight:700; }
  header .today { font-size:1.05rem; margin-top:6px; opacity:.95; }
  header .now { display:inline-block; margin-top:10px; background:rgba(255,255,255,.18); border-radius:999px; padding:5px 12px; font-size:.85rem; }
  header .now[hidden] { display:none; }
  .muted { color:var(--muted); font-size:.8rem; }
  .label { font-size:.8rem; color:var(--muted); margin:14px 2px 6px; font-weight:500; }
  .row { display:flex; gap:8px; overflow-x:auto; padding:2px 2px 6px; scrollbar-width:none; }
  .row::-webkit-scrollbar { display:none; }
  button { font-family:inherit; font-size:16px; cursor:pointer; user-select:none; }
  .chip { flex:none; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:16px; padding:8px 14px; line-height:1.2; }
  .chip[aria-pressed=true] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .chip small { display:block; font-size:.7rem; opacity:.75; }
  .summary { display:flex; align-items:baseline; gap:8px; margin:20px 2px 4px; }
  .summary b { font-size:2rem; color:var(--ok); }
  h2 { font-size:.95rem; margin:18px 2px 8px; color:var(--muted); font-weight:500; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .room { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:12px 14px; display:flex; flex-direction:column; gap:2px; }
  .room .num { font-size:1.5rem; font-weight:700; display:flex; align-items:center; gap:8px; }
  .room .num::before { content:""; width:9px; height:9px; border-radius:50%; background:var(--ok); }
  .room .sub { font-size:.78rem; color:var(--muted); }
  .room .until { font-size:.8rem; color:var(--ok); }
  .room button { margin-top:8px; border:0; border-radius:12px; padding:8px; background:var(--okbg); color:var(--ok); font-weight:500; font-size:.9rem; }
  .room.taken { background:var(--warnbg); }
  .room.taken .num::before { background:var(--warn); }
  .room.taken .until { color:var(--warn); }
  .room.taken button { background:transparent; color:var(--warn); text-decoration:underline; padding:4px; }
  .note { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-top:14px; }
  dialog { border:0; border-radius:20px; padding:20px; background:var(--card); color:var(--text); width:min(320px,90vw); }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  dialog input { width:100%; font:inherit; font-size:16px; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--text); margin:10px 0 14px; }
  dialog .btns { display:flex; gap:8px; }
  dialog .btns button { flex:1; border:0; border-radius:12px; padding:10px; background:var(--accent); color:#fff; }
  dialog .btns button[value=cancel] { background:var(--line); color:var(--text); }
</style>
</head>
<body>
<main>
  <header>
    <h1>כיתה פנויה 🏫</h1>
    <div class="today" id="today"></div>
    <div class="now" id="now" hidden></div>
  </header>
  <div class="label">יום</div><div class="row" id="days" role="group" aria-label="בחירת יום"></div>
  <div class="label">שעה</div><div class="row" id="hours" role="group" aria-label="בחירת שעה"></div>
  <div id="result" aria-live="polite"></div>
  <p class="muted" id="updated"></p>
</main>
<dialog id="nameDialog">
  <form method="dialog">
    <b>איך קוראים לך?</b>
    <div class="muted">החדר שתפסת לא יופיע יותר לאחרים ברשימת הפנויים</div>
    <input id="nameInput" maxlength="20" required autocomplete="nickname">
    <div class="btns"><button value="ok">תפוס</button><button value="cancel" formnovalidate>ביטול</button></div>
  </form>
</dialog>
<script>
// Firebase Realtime Database URL for room claims (see README). Empty = app works without claiming.
const DB_URL = 'https://free-room-4c651-default-rtdb.europe-west1.firebasedatabase.app';
// Google Analytics measurement ID, like 'G-ABC123' (see README). Empty = no analytics.
const GA_ID = 'G-1BV6Q54MZW';
if (GA_ID) {
  document.head.append(Object.assign(document.createElement('script'), { async: true, src: 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID }));
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { dataLayer.push(arguments); };
  gtag('js', new Date());
  gtag('config', GA_ID);
}

const DAY = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const MONTH = ['בינואר','בפברואר','במרץ','באפריל','במאי','ביוני','ביולי','באוגוסט','בספטמבר','באוקטובר','בנובמבר','בדצמבר'];
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayIso = () => iso(new Date());
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const myId = store.get('id') || (() => { const id = crypto.randomUUID(); store.set('id', id); return id; })();

// "ט1 104*" -> {num:"104", label:"ט1", floor:"1"}; rooms without a 3-digit number are "special" (floor null)
function show(room) {
  const clean = room.replace(/[*+\-\s]+$/,'').replace(/\s+-\s+/,' ');
  const m = clean.match(/^(.*?)\s*(\d{3})\b(.*)$/);
  return m ? { num: m[2], label: (m[1] + m[3]).trim(), floor: m[2][0] } : { num: clean, label: '', floor: null };
}
// regular classrooms only: numbered, not in the basement labs (floor 0), not a lab by name
const regular = r => { const s = show(r); return s.floor && s.floor !== '0' && !/מעבד|מע'/.test(r); };
const MAX_PER_DAY = 2; // keep in sync with bot.mjs
const dbKey = r => r.replace(/[.#$\[\]\/]/g, '_');

let data, day, hour, claims = {};
const el = (tag, props, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
const hoursOf = d => { const h = data.days[d]?.hours ?? {}; return [h, Object.keys(h).sort((a,b) => a - b)]; };

// today if school isn't over yet, otherwise the next day that has a timetable
function pickDay() {
  const days = Object.keys(data.days).filter(d => d >= todayIso()).sort();
  const [h, keys] = hoursOf(todayIso());
  const lastBusy = keys.filter(k => h[k].busy.length).pop();
  if (days[0] === todayIso() && lastBusy && h[lastBusy].end > nowHM()) return days[0];
  return days.find(d => d > todayIso()) ?? days[0];
}
// the lesson running now (or the next one); on other days the first hour with lessons
function pickHour() {
  const [h, keys] = hoursOf(day);
  if (day !== todayIso()) return keys.find(k => h[k].busy.length) ?? keys[0];
  return keys.find(k => h[k].busy.length && h[k].end > nowHM()) ?? keys[keys.length - 1];
}

function chips(box, items, current, onPick) {
  box.replaceChildren(...items.map(([key, main, sub]) => {
    const b = el('button', { className: 'chip', type: 'button', onclick: () => onPick(key) }, main, sub ? el('small', {}, sub) : '');
    b.setAttribute('aria-pressed', key === current);
    return b;
  }));
  box.querySelector('[aria-pressed=true]')?.scrollIntoView({ inline: 'center', block: 'nearest' });
}

function renderHeader() {
  const n = new Date();
  document.getElementById('today').textContent = `היום יום ${DAY[n.getDay()]}, ${n.getDate()} ${MONTH[n.getMonth()]}`;
  const [h, keys] = hoursOf(todayIso());
  const t = nowHM(), cur = keys.find(k => h[k].start <= t && t < h[k].end);
  const now = document.getElementById('now');
  now.hidden = !cur;
  if (cur) now.textContent = `עכשיו שעה ${cur} · עד ${h[cur].end}`;
}

function render() {
  renderHeader();
  const tomorrow = iso(new Date(Date.now() + 864e5));
  chips(document.getElementById('days'), Object.keys(data.days).filter(d => d >= todayIso()).sort().map(d => {
    const dt = new Date(d + 'T12:00');
    return [d, d === todayIso() ? 'היום' : d === tomorrow ? 'מחר' : DAY[dt.getDay()], `${dt.getDate()}.${dt.getMonth()+1}`];
  }), day, d => select(d, null));

  const [hours, keys] = hoursOf(day);
  chips(document.getElementById('hours'), keys.map(h => [h, `שעה ${h}`, hours[h].start]), hour, h => select(day, h));

  const res = document.getElementById('result');
  if (!hours[hour]) { res.replaceChildren(el('div', { className: 'note' }, 'אין מערכת ליום הזה.')); return; }
  const busy = new Set(hours[hour].busy);
  const free = data.rooms.filter(r => regular(r) && !busy.has(r));
  const later = keys.filter(h => +h > +hour);
  const until = r => { let end = hours[hour].end; for (const h of later) { if (hours[h].busy.includes(r)) break; end = hours[h].end; } return end; };
  const open = free.filter(r => !claims[dbKey(r)]);
  // rooms claimed by others are hidden entirely; your own claim stays so you can release it
  const shown = free.filter(r => !claims[dbKey(r)] || claims[dbKey(r)].id === myId);

  const out = [];
  if (data.days[day].holiday) out.push(el('div', { className: 'note' }, '📅 ' + data.days[day].holiday));
  out.push(el('div', { className: 'summary' }, el('b', {}, open.length), 'חדרים פנויים'));
  const floors = {};
  for (const r of shown) (floors[show(r).floor] ??= []).push(r);
  for (const f of Object.keys(floors).sort()) {
    out.push(el('h2', {}, `קומה ${f}`));
    out.push(el('div', { className: 'grid' }, ...floors[f].sort((a,b) => show(a).num.localeCompare(show(b).num)).map(r => card(r, until(r)))));
  }
  if (!shown.length) out.push(el('div', { className: 'note' }, 'אין כיתות פנויות בשעה הזו 😕'));
  res.replaceChildren(...out);
}

function card(r, untilTime) {
  const s = show(r), c = claims[dbKey(r)];
  const kids = [el('div', { className: 'num' }, s.num), el('div', { className: 'sub' }, s.label ? `כיתת ${s.label}` : ' ')];
  if (c) { // only your own claims reach here
    kids.push(el('div', { className: 'until' }, '🙋 תפסת את החדר'));
    kids.push(el('button', { type: 'button', onclick: () => unclaim(r) }, 'שחרר'));
  } else {
    kids.push(el('div', { className: 'until' }, 'פנוי עד ' + untilTime));
    if (DB_URL) kids.push(el('button', { type: 'button', onclick: () => claim(r) }, 'אני הולך/ת לשם'));
  }
  return el('div', { className: 'room' + (c ? ' taken' : '') }, ...kids);
}

function select(d, h) { day = d; hour = h ?? pickHour(); claims = {}; render(); refreshClaims(); }

const claimUrl = (r = '', h = hour) => `${DB_URL}/claims/${day}/${h}${r && '/' + encodeURIComponent(dbKey(r))}.json`;
async function refreshClaims() {
  if (!DB_URL || !data) return;
  const [d, h] = [day, hour];
  try {
    const dayClaims = await fetch(`${DB_URL}/claims/${d}.json`).then(r => r.json()) || {};
    // a claim holds the room from its hour until the end of the day
    const got = {};
    for (const [ch, rooms] of Object.entries(dayClaims)) if (+ch <= +h) for (const [k, c] of Object.entries(rooms || {})) got[k] ??= { ...c, h: ch };
    if (d === day && h === hour) { claims = got; render(); } // ignore answers for a slot the user already left
  } catch {}
}

function askName() {
  const dlg = document.getElementById('nameDialog'), input = document.getElementById('nameInput');
  input.value = store.get('name') || '';
  dlg.showModal();
  return new Promise(res => dlg.addEventListener('close', () => {
    const name = input.value.trim().slice(0, 20);
    if (dlg.returnValue === 'ok' && name) { store.set('name', name); res(name); } else res(null);
  }, { once: true }));
}

async function claim(r) {
  const name = store.get('name') || await askName();
  if (!name) return;
  // shortcut: limit is checked here and enforced by bot.mjs (no login, so a new id gets around it)
  const dayClaims = await fetch(`${DB_URL}/claims/${day}.json`).then(x => x.json()).catch(() => null) || {};
  const mine = Object.values(dayClaims).flatMap(h => Object.values(h || {})).filter(c => c.id === myId).length;
  if (mine >= MAX_PER_DAY) return alert(`אפשר לתפוס עד ${MAX_PER_DAY} כיתות ביום. שחרר/י כיתה אחרת קודם.`);
  // the database rules only allow writing to an empty slot, so two people can't claim the same room
  const status = await fetch(claimUrl(r), { method: 'PUT', body: JSON.stringify({ by: name, id: myId, at: Date.now() }) })
    .then(x => x.status).catch(() => 0);
  if (status === 200) window.gtag?.('event', 'claim_room');
  if (status === 401) alert('מישהו תפס את החדר הזה רגע לפני 😅');
  else if (status !== 200) alert('לא הצלחתי לתפוס – בדוק חיבור לאינטרנט ונסה שוב.');
  refreshClaims();
}
async function unclaim(r) {
  await fetch(claimUrl(r, claims[dbKey(r)]?.h), { method: 'DELETE' }).catch(() => {});
  refreshClaims();
}

async function load() {
  try {
    data = await fetch('data.json', { cache: 'no-cache' }).then(r => r.json());
  } catch {
    document.getElementById('updated').textContent = 'לא הצלחתי לטעון נתונים. בדוק חיבור לאינטרנט.';
    return;
  }
  const u = new Date(data.updated);
  document.getElementById('updated').textContent =
    `המערכת עודכנה משחף ב-${u.getDate()}.${u.getMonth()+1} ${pad(u.getHours())}:${pad(u.getMinutes())}. חדר שנראה פנוי עדיין יכול להיות תפוס בפועל.`;
  select(pickDay(), null);
}
load();
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
setInterval(() => { if (!document.hidden) refreshClaims(); }, 20000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
