name: update timetable
on:
  schedule:
    - cron: '*/30 4-14 * * 0-5'   # every 30 min, ~06:00-17:00 Israel time, Sun-Fri (GitHub may delay a few minutes)
  workflow_dispatch:               # "Run workflow" button for a manual refresh
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scrape.test.mjs && node bot.test.mjs && node scrape.mjs
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "update data" && git push)
